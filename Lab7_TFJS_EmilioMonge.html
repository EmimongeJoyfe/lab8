<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 7B - Detección de Objetos en Webcam (COCO-SSD)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: #020617;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #webcam,
    #overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #webcam {
      object-fit: cover;
      transform: scaleX(-1);
      background: #020617;
    }

    #overlay { pointer-events: none; }

    .hud {
      position: fixed;
      z-index: 2;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      display: flex;
      gap: 16px;
      padding: 10px 16px;
      border: 1px solid rgba(226, 232, 240, 0.25);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.78);
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }

    .hud-item { min-width: 86px; text-align: center; }
    .hud-label {
      display: block;
      margin-bottom: 3px;
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #status {
      position: fixed;
      z-index: 2;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 14px;
      width: fit-content;
      max-width: min(700px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 9px 13px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.78);
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .screen-message {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.56);
    }

    .message-card {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid rgba(226, 232, 240, 0.25);
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.96);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .message-card h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 5vw, 32px);
    }

    .message-card p {
      margin: 0 0 20px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #7dd3fc; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .hud { gap: 6px; padding: 8px; }
      .hud-item { min-width: 72px; }
      .hud-value { font-size: 19px; }
    }
  </style>
</head>
<body>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <section class="hud" aria-label="Métricas de detección">
    <div class="hud-item">
      <span class="hud-label">Objetos</span>
      <span id="objectsCount" class="hud-value">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Latencia</span>
      <span id="inferenceTime" class="hud-value">0 ms</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Principal</span>
      <span id="topClass" class="hud-value" style="font-size: 16px; text-transform: capitalize;">-</span>
    </div>
  </section>

  <p id="status" role="status" aria-live="polite">Preparando cámara y modelo COCO-SSD...</p>

  <section id="message" class="screen-message">
    <div class="message-card">
      <h1 id="messageTitle">Detección de Objetos en Vivo</h1>
      <p id="messageText">Permite el acceso a la cámara para identificar personas y objetos en tiempo real con TensorFlow.js y el modelo COCO-SSD.</p>
      <button id="startButton" type="button" hidden>Empezar</button>
    </div>
  </section>

  <script>
    const videoEl = document.getElementById("webcam");
    const canvasEl = document.getElementById("overlay");
    const ctx = canvasEl.getContext("2d");
    const objectsCountEl = document.getElementById("objectsCount");
    const inferenceTimeEl = document.getElementById("inferenceTime");
    const topClassEl = document.getElementById("topClass");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const messageTitleEl = document.getElementById("messageTitle");
    const messageTextEl = document.getElementById("messageText");
    const startButtonEl = document.getElementById("startButton");

    let model = null;
    let stream = null;
    let animationFrameId = null;
    let running = true;
    let isDetecting = false;
    let predictions = [];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      canvasEl.width = Math.round(window.innerWidth * pixelRatio);
      canvasEl.height = Math.round(window.innerHeight * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      drawOverlay();
    }

    function getDisplayBox(bbox) {
      const [x, y, w, h] = bbox;
      const sourceWidth = videoEl.videoWidth;
      const sourceHeight = videoEl.videoHeight;
      if (!sourceWidth || !sourceHeight) return null;

      const scale = Math.max(window.innerWidth / sourceWidth, window.innerHeight / sourceHeight);
      const offsetX = (window.innerWidth - sourceWidth * scale) / 2;
      const offsetY = (window.innerHeight - sourceHeight * scale) / 2;

      const mirroredX = sourceWidth - (x + w);
      return {
        x: offsetX + mirroredX * scale,
        y: offsetY + y * scale,
        width: w * scale,
        height: h * scale,
      };
    }

    function drawOverlay() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);

      if (!predictions.length) return;

      predictions.forEach((pred) => {
        const box = getDisplayBox(pred.bbox);
        if (!box) return;

        let strokeColor = "#ef4444";
        if (pred.score > 0.74) {
          strokeColor = "#22c55e";
        } else if (pred.score > 0.49) {
          strokeColor = "#eab308";
        }

        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(box.x, box.y, box.width, box.height);

        const label = `${pred.class} (${Math.round(pred.score * 100)}%)`;
        ctx.font = "bold 14px Arial";
        const textMetrics = ctx.measureText(label);
        const textWidth = textMetrics.width;
        const textHeight = 18;
        const tagY = box.y > textHeight + 8 ? box.y - textHeight - 6 : box.y + 4;

        ctx.fillStyle = strokeColor;
        ctx.fillRect(box.x, tagY, textWidth + 12, textHeight + 4);

        ctx.fillStyle = "#020617";
        ctx.fillText(label, box.x + 6, tagY + 15);
      });
    }

    async function detectFrame() {
      if (!running || !model) return;

      if (!isDetecting && videoEl.readyState >= 2) {
        isDetecting = true;
        const t0 = performance.now();
        try {
          const results = await model.detect(videoEl);
          const elapsed = Math.round(performance.now() - t0);

          if (running) {
            predictions = results;
            objectsCountEl.textContent = predictions.length;
            inferenceTimeEl.textContent = `${elapsed} ms`;
            topClassEl.textContent = predictions.length ? predictions[0].class : "-";
            drawOverlay();

            if (predictions.length > 0) {
              setStatus(`Detectados ${predictions.length} objeto(s). Clase principal: ${predictions[0].class} (${Math.round(predictions[0].score * 100)}%)`);
            } else {
              setStatus("Buscando objetos en el encuadre...");
            }
          }
        } catch (err) {
          console.error("Error en detección:", err);
        } finally {
          isDetecting = false;
        }
      }

      if (running) {
        animationFrameId = requestAnimationFrame(detectFrame);
      }
    }

    function startDetection() {
      messageEl.hidden = true;
      startButtonEl.hidden = true;
      setStatus("Detección activa. Muestra objetos a la cámara.");
    }

    async function start() {
      try {
        setStatus("Solicitando acceso a la cámara...");
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        videoEl.srcObject = stream;
        await videoEl.play();

        setStatus("Cargando modelo COCO-SSD...");
        model = await cocoSsd.load();

        messageTitleEl.textContent = "COCO-SSD preparado";
        messageTextEl.textContent = "El modelo está cargado y listo para inferir en tiempo real. Pulsa «Empezar» para iniciar la detección.";
        startButtonEl.textContent = "Empezar";
        startButtonEl.hidden = false;
        setStatus("Listo. Pulsa «Empezar».");

        detectFrame();
      } catch (error) {
        console.error("Error al iniciar:", error);
        messageTitleEl.textContent = "No se pudo iniciar";
        messageTextEl.textContent = `Error: ${error.message || error}. Asegúrate de conceder permisos de cámara y abrir la página en localhost o HTTPS.`;
        setStatus(`Error al iniciar: ${error.message || error}`);
        stream?.getTracks().forEach((track) => track.stop());
        stream = null;
      }
    }

    function cleanup() {
      running = false;
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      stream?.getTracks().forEach((track) => track.stop());
      stream = null;
      model?.dispose?.();
      model = null;
    }

    startButtonEl.addEventListener("click", startDetection);
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("pagehide", cleanup);
    resizeCanvas();
    start();
  </script>
</body>
</html>
